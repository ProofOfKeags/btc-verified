# Project-owned implementation pin for differential fuzzing.
# Fuzz/build.py validates the local Core checkout against this revision.

[lean]
repository = "https://github.com/leanprover/lean4"
# Exact source behind lean-toolchain. The Linux memory check rebuilds stage 1
# from this revision with Lean's sanitizer preset and allocator visibility.
rev = "3dc1a088b6d2d8eafe25a7cd7ec7b58d731bd7cc"

[bitcoinkernel]
repository = "https://github.com/bitcoin/bitcoin"

# Selected from Core master on 2026-09-10, including the latest public C API
# header change at selection time:
# https://github.com/bitcoin/bitcoin/commit/1bec7fa22c9f159eda42b95543e231322df1f755
# Pin the complete Core source tree. For bitcoinfuzz, pass rev as BITCOINKERNEL_REF.
rev = "fc6923cec5b440b611700f6629d8c6a61c6f11bd"

[campaign]
# These fixed controls make the pull-request campaign bounded and replayable.
seed = 1
runs = 100000
max_len = 4096
timeout_seconds = 10
rss_limit_mb = 2048
use_value_profile = true
