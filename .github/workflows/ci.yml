name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lake-build:
    name: lake build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Cache elan's toolchain install plus lake's package checkouts and
      # build output, keyed on the two files that determine whether either
      # needs to change. A near-miss (e.g. only the manifest changed) still
      # restores the previous toolchain via restore-keys.
      - uses: actions/cache@v4
        with:
          path: |
            .lake
            ~/.elan
          key: ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-
      # `lake build` covers the default targets: the library plus Tests
      # (golden vectors and the axiom audit, which fails on `sorry`).
      # `lake test` decodes the block-481824 fixture through the verified
      # block codec.
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: true
          lint: true

  nix-develop:
    name: nix develop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      # Persists the Nix store (nixpkgs closure, flake eval) across runs so
      # `nix-installer-action` and `nix flake check` don't redo the same
      # evaluation from scratch every time.
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Check flake
        run: nix flake check
      - name: Fetch mathlib cache through dev shell
        run: nix develop -c lake exe cache get
      - name: Build through dev shell
        run: nix develop -c lake build

  transaction-conformance:
    name: transaction conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # Keep Lean state separate from .lake/fuzz, whose Core source, reports,
      # corpora, and native products are intentionally not a dependency cache.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/build
            .lake/packages
          key: ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-
      - name: Read pinned Core revision
        id: core_pin
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import os
          import re
          import tomllib

          with open("fuzz.toml", "rb") as config_file:
              revision = tomllib.load(config_file)["bitcoinkernel"]["rev"]
          if not isinstance(revision, str) or re.fullmatch(r"[0-9a-f]{40}", revision) is None:
              raise SystemExit("fuzz.toml must contain an exact lowercase 40-hex Core revision")
          print(f"revision={revision}")
          print(f"workspace={hashlib.sha256(os.getcwd().encode()).hexdigest()[:16]}")
          PY
      # Core source and its configured minimal build are immutable for a given
      # revision, platform, Nix toolchain, and build recipe. Restoring this
      # cache makes CMake's bitcoinkernel build an up-to-date check instead of
      # recompiling Core. The current Lean objects and harness are still linked
      # on every run.
      - uses: actions/cache@v4
        with:
          path: |
            .lake/fuzz/core
            .lake/fuzz/core-build-ci
          # CMake build trees contain absolute paths, so the fixed runner image
          # and workspace identity are part of this exact-only cache key.
          key: ubuntu-24.04-${{ runner.arch }}-transaction-core-${{ steps.core_pin.outputs.workspace }}-${{ steps.core_pin.outputs.revision }}-${{ hashFiles('flake.nix', 'flake.lock', 'Fuzz/check.py', 'Fuzz/build.py') }}
      # A compiler-object cache remains useful after a deliberate Core retarget
      # or build-recipe change. ccache validates compiler flags and input
      # contents before reusing an object.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ubuntu-24.04-${{ runner.arch }}-transaction-ccache-${{ steps.core_pin.outputs.revision }}-${{ hashFiles('flake.nix', 'flake.lock', 'Fuzz/check.py', 'Fuzz/build.py') }}
          restore-keys: |
            ubuntu-24.04-${{ runner.arch }}-transaction-ccache-${{ steps.core_pin.outputs.revision }}-
            ubuntu-24.04-${{ runner.arch }}-transaction-ccache-
      - name: Run transaction conformance check
        run: nix develop -c python3 -B Fuzz/check.py
      - name: Upload transaction conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lake/fuzz/runs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
