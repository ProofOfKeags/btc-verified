name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lake-build:
    name: lake build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Cache elan's toolchain install plus lake's package checkouts and
      # build output, keyed on the two files that determine whether either
      # needs to change. A near-miss (e.g. only the manifest changed) still
      # restores the previous toolchain via restore-keys.
      - uses: actions/cache@v4
        with:
          path: |
            .lake
            ~/.elan
          key: ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-
      # `lake build` covers the default targets: the library plus Tests
      # (golden vectors and the axiom audit, which fails on `sorry`).
      # `lake test` decodes the block-481824 fixture through the verified
      # block codec.
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: true
          lint: true
      # The module-discipline audit (one type per module; instances live
      # with their type): an environment-introspection executable. Its
      # compile-time library import means `lake exe` rebuilds anything
      # stale first, so it audits exactly what was just built.
      - name: Module-discipline audit
        run: lake exe module-audit
      # Build our nine-function library from Lean and C, authenticating only
      # Core's public header. This does not build or execute Bitcoin Core.
      - name: Native transaction C ABI smoke test
        id: kernel_abi
        run: lake run kernel-check
      - name: Upload native ABI diagnostics
        if: ${{ always() && steps.kernel_abi.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: kernel-abi-diagnostics
          path: .lake/build/kernel/abi-test.log
          if-no-files-found: ignore
          retention-days: 7

  nix-develop:
    name: nix develop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      # Persists the Nix store (nixpkgs closure, flake eval) across runs so
      # `nix-installer-action` and `nix flake check` don't redo the same
      # evaluation from scratch every time.
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Check flake
        run: nix flake check
      - name: Fetch mathlib cache through dev shell
        run: nix develop -c lake exe cache get
      - name: Build through dev shell
        run: nix develop -c lake build

  transaction-conformance:
    name: transaction conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: conformance-elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      # Core build identities also check tool versions, flags and absolute paths.
      # Neither run evidence nor the mutation corpus is a dependency cache.
      - uses: actions/cache/restore@v4
        id: core_cache
        with:
          path: |
            .lake/conformance/sources
            .lake/conformance/builds
          key: conformance-core-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Kernel/abi.toml', 'Fuzz/Build.lean', 'flake.nix', 'flake.lock') }}
      - name: Compare the transaction implementations
        run: |
          set -o pipefail
          mkdir -p .lake/conformance
          nix develop -c lake run transaction-conformance 2>&1 | tee .lake/conformance/bootstrap.log
      # A failed comparison may still leave a validated, reusable Core build.
      # Interrupted fetches/configures never receive the completion marker and
      # therefore cannot poison this immutable-key cache.
      - name: Check reusable Core cache
        id: core_ready
        if: always()
        run: |
          if [[ -f .lake/conformance/core-cache-ready ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/save@v4
        if: >-
          always() && steps.core_cache.outcome == 'success' &&
          steps.core_cache.outputs.cache-hit != 'true' &&
          steps.core_ready.outputs.ready == 'true'
        with:
          path: |
            .lake/conformance/sources
            .lake/conformance/builds
          key: ${{ steps.core_cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transaction-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .lake/conformance/bootstrap.log
            .lake/conformance/runs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
